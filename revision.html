  <header>
    <h1>Révision</h1>
    <p>Une phrase, un trou : quel point de grammaire manque ?</p>
  </header>

  <main class="page-revision">
    <section class="panneau-filtres" aria-label="Réglages de la révision">
      <div class="groupe-filtres">
        <span class="etiquette-filtre">Niveau</span>
        <div id="niveaux-revision" class="puces"></div>
      </div>
      <div class="groupe-filtres">
        <span class="etiquette-filtre">Phrases</span>
        <div id="sources-revision" class="puces"></div>
      </div>
      <div class="ligne-bas-filtres">
        <label class="interrupteur">
          <input type="checkbox" id="revision-inconnus">
          <span class="interrupteur-piste" aria-hidden="true"></span>
          Seulement les points que je ne connais pas encore
        </label>
        <span id="score" class="compteur" aria-live="polite"></span>
      </div>
    </section>

    <article id="question" class="fiche question" aria-live="polite"></article>
    <p id="vide-revision" class="vide" hidden>Aucune phrase ne correspond à ces réglages.</p>
  </main>

    Les extraits de chansons sont les mêmes courtes citations que sur les fiches. Paroles © Aimyon et ses ayants droit.
